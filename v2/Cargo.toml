[package]
name = "html-colors-native-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0"
description = "Compiled-in Native V2 port of HTML Colors"
repository = "https://github.com/almatkai/html-colors"
include = ["/src/**", "/examples/**", "/tests/**", "/scripts/**", "/licenses/**", "/assets/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/manifest.json", "/provenance.json", "/package.json", "/package-lock.json"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["macros", "rt-multi-thread"] }
tempfile = "=3.23.0"
log = "=0.4.28"
